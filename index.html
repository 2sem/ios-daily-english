<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card News Generator — iOS Daily English</title>
<link rel="stylesheet" href="./css/style.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Card News Generator</span>
        <span class="topbar-meta"><span id="cardCount">0</span> pages · 1080×1350</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-status" id="statusText"></span>
        <button class="btn-primary" id="exportAllBtn">Download PDF</button>
      </div>
    </header>

    <div class="body">

      <!-- FORM -->
      <aside class="form-pane" id="formPane">

        <div class="paste-box">
          <div class="paste-title">Paste &amp; auto-fill</div>
          <div class="paste-hint">Paste your full day's text (terms, quizzes, answers). Fields below fill in automatically.</div>
          <textarea class="fld paste-textarea" id="pasteText" placeholder="Paste the full day's text here..."></textarea>
          <button class="btn-parse" id="parseBtn">Auto-fill fields</button>
          <div class="parse-msg" id="parseMsg"></div>
        </div>

        <div class="section-title">Header</div>
        <div class="header-row">
          <div class="field field-day"><span class="lbl">Day</span><input class="fld" id="dayField"></div>
          <div class="field field-emoji"><span class="lbl">Emoji</span><input class="fld" id="emojiField"></div>
          <div class="field field-flex"><span class="lbl">Title</span><input class="fld" id="titleField"></div>
        </div>

        <div class="divider"></div>
        <div class="section-header">
          <div class="section-title">Vocabulary</div>
          <button class="btn-add" data-action="addTerm">+ term</button>
        </div>
        <div id="termList"></div>

        <div class="divider"></div>
        <div class="section-header">
          <div class="section-title">Quizzes</div>
          <button class="btn-add" data-action="addQuiz">+ quiz</button>
        </div>
        <div id="quizList"></div>

        <div class="divider"></div>
        <div class="section-header">
          <div class="section-title">Previous Day — Answers</div>
        </div>
        <div class="field field-prevday"><span class="lbl">Prev day</span><input class="fld" id="prevDayField"></div>
        <div class="section-header">
          <span class="lbl lbl-inline">Answers</span>
          <button class="btn-add btn-add-sm" data-action="addAnswer">+</button>
        </div>
        <div id="answerList"></div>

        <div class="section-header section-header-tight">
          <span class="lbl lbl-inline">Quick review</span>
          <button class="btn-add btn-add-sm" data-action="addReview">+</button>
        </div>
        <div id="reviewList"></div>

        <div class="spacer"></div>
      </aside>

      <!-- PREVIEW -->
      <main class="preview-pane">
        <div class="cards-wrap" id="cardsList"></div>
      </main>

    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
